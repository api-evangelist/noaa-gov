    type: ChangeLog
- aid: noaa-gov:co-ops-data-api
  name: CO-OPS Data Retrieval API (Tides & Currents)
  description: >-
    The Center for Operational Oceanographic Products and Services (CO-OPS) Data API returns water-level
    observations, tide predictions, currents, meteorological observations, and operational forecast model
    output (NOS OFS nowcasts) for over 200 stations along US coasts, the Great Lakes, and US territories.
    Supports XML, JSON, and CSV with selectable datums (MLLW, MHHW, MSL, plus Great Lakes datums), units,
    and time zones. Free, no key required. Stable endpoint at api.tidesandcurrents.noaa.gov.
  humanURL: https://api.tidesandcurrents.noaa.gov/api/prod/
  baseURL: https://api.tidesandcurrents.noaa.gov/api/prod
  tags:
  - Ocean
  - Tides
  - Currents
  - Water Level
  - Marine
  properties:
  - url: https://api.tidesandcurrents.noaa.gov/api/prod/
    type: Documentation
  - url: https://tidesandcurrents.noaa.gov/api-helper/url-generator.html
    type: Sandbox
  - url: https://tidesandcurrents.noaa.gov/products.html
    type: Documentation
- aid: noaa-gov:co-ops-metadata-api
  name: CO-OPS Metadata API (MDAPI v1)
  description: >-
    The CO-OPS Metadata API exposes station inventory, harmonic constituents, NOS PORTS station lists,
    flood thresholds, and high/low water station catalogs. Supports radius and bounding-box station discovery
    and returns JSON or XML. Stable endpoint at api.tidesandcurrents.noaa.gov/mdapi/prod.
  humanURL: https://api.tidesandcurrents.noaa.gov/mdapi/prod/
  baseURL: https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi
  tags:
  - Ocean
  - Metadata
  - Stations
  - PORTS
  tags_raw:
