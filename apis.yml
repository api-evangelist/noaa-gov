    type: BaseURL
- aid: noaa-gov:nodd-open-data
  name: NOAA Open Data Dissemination (NODD)
  description: >-
    NODD is NOAA's bulk-data dissemination program, providing free, low-latency public access to tens
    of terabytes per day of forecast model output, satellite imagery, radar, and observation archives
    through public-private partnerships with AWS, Google Cloud, and Microsoft Azure. Datasets include
    GFS, GEFS, HRRR, RAP, NAM, RRFS, GraphCast, GOES-16/17/18/19, NEXRAD Level II/III, and hundreds of
    climate archives — all addressable as S3/GCS/Azure Blob objects, without keys.
  humanURL: https://www.noaa.gov/information-technology/open-data-dissemination
  baseURL: https://noaa-gfs-bdp-pds.s3.amazonaws.com
  tags:
  - Open Data
  - Cloud
  - Bulk Data
  - Forecast Models
  - Satellite
  - Radar
  properties:
