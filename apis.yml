- aid: noaa-gov:inport-metadata-api
  name: NOAA InPort Metadata Catalog
  description: >-
    InPort is the authoritative metadata repository for NOAA Fisheries and the National Ocean Service
    and the NOAA-wide platform for data management plans. Catalog records describe data products, services,
    projects, and contacts; the public-facing site supports search and item retrieval, while web service
    endpoints support catalog-item path lookup and contact management. Public API endpoints are stabilising
    — full machine-to-machine surface is in beta.
