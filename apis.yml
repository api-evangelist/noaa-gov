- aid: noaa-gov:foss-landings-api
  name: NOAA Fisheries One Stop Shop (FOSS) ODS / ORDS
  description: >-
    The Fisheries One Stop Shop (FOSS) Operational Data Store, hosted on Oracle REST Data Services (ORDS),
    exposes US commercial fisheries landings, foreign trade, fishing gear, and species reference data.
    Cloud-hosted at apps-st.fisheries.noaa.gov with a public metadata catalog and paginated REST endpoints;
    suitable for fisheries economics, stock assessment, and policy analysis.
