    type: Authentication
  - url: rate-limits/noaa-gov-rate-limits.yml
    type: RateLimits
- aid: noaa-gov:ndbc-data-service
  name: National Data Buoy Center (NDBC) Web Data Service
  description: >-
    NDBC publishes real-time meteorological and oceanographic observations (the last 45 days) and historical
    archives from a global network of over 900 moored buoys, drifting buoys, C-MAN coastal stations, and
    partner stations. Data is exposed via HTTP file URLs, a THREDDS Data Server, and an OGC API Features
    collection. Observations include wave height, period, direction, sea surface temperature, wind, air
    pressure, salinity, and visibility.
  humanURL: https://www.ndbc.noaa.gov/docs/ndbc_web_data_guide.pdf
  baseURL: https://www.ndbc.noaa.gov/data
  tags:
  - Ocean
  - Marine
  - Buoys
  - Waves
  - Observations
  properties:
  - url: https://www.ndbc.noaa.gov/docs/ndbc_web_data_guide.pdf
    type: Documentation
  - url: https://www.ndbc.noaa.gov/faq/rt_data_access.shtml
    type: Documentation
  - url: https://www.ndbc.noaa.gov/thredds/catalog.html
    type: Documentation
- aid: noaa-gov:erddap-coastwatch
  name: NOAA CoastWatch ERDDAP Server
  description: >-
    ERDDAP (Environmental Research Division Data Access Program) is a NOAA-funded, open-source server
    that unifies access to gridded (`griddap`) and tabular (`tabledap`) scientific datasets across OPeNDAP,
    WMS, and REST. CoastWatch, ERD/PFEG, NCEI, IOOS, and many NOAA line offices each operate ERDDAP instances
    exposing tens of thousands of datasets (satellite SST, chlorophyll, ocean color, altimetry, model
    output, in-situ observations) in CSV, JSON, NetCDF, MATLAB, Parquet, and image formats.
  humanURL: https://coastwatch.pfeg.noaa.gov/erddap/information.html
  baseURL: https://coastwatch.pfeg.noaa.gov/erddap
  tags:
  - Ocean
  - Satellite
