- aid: noaa-gov:ncei-access-data-service
  name: NCEI Access Data Service (v1)
  description: >-
    The National Centers for Environmental Information (NCEI) Access Data Service is the modern, token-free
    replacement for the legacy CDO web service. It exposes daily summaries (GHCND), hourly summaries,
    monthly summaries, normals, global summaries of the day, sea-surface temperature, and many archived
    climate datasets. Returns CSV, JSON, NetCDF, or PDF. Stable endpoint at ncei.noaa.gov/access/services/data/v1.
  humanURL: https://www.ncei.noaa.gov/support/access-data-service-api-user-documentation
  baseURL: https://www.ncei.noaa.gov/access/services/data/v1
  tags:
  - Climate
  - Historical
  - Stations
  - GHCND
  properties:
  - url: https://www.ncei.noaa.gov/support/access-data-service-api-user-documentation
    type: Documentation
  - url: https://www.ncei.noaa.gov/access
    type: Documentation
- aid: noaa-gov:ncei-cdo-v2-api
  name: NCEI Climate Data Online (CDO) v2 API
  description: >-
    The legacy Climate Data Online v2 REST API exposes datasets, datatypes, stations, locations, data
    categories, and observation records. Requires a free token from ncei.noaa.gov/cdo-web/token in the
    `token` header. Enforces 5 requests/second and 10,000 requests/day per token. Being superseded by
    the Access Data Service v1, but still widely deployed.
  humanURL: https://www.ncdc.noaa.gov/cdo-web/webservices/v2
  baseURL: https://www.ncei.noaa.gov/cdo-web/api/v2
  tags:
  - Climate
  - Historical
  - Stations
  - Datasets
  properties:
