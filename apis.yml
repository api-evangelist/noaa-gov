    type: Documentation
  - url: https://api.tidesandcurrents.noaa.gov/mdapi/prod/releasenotes.html
    type: ChangeLog
- aid: noaa-gov:co-ops-derived-product-api
  name: CO-OPS Derived Product API (DPAPI v0.1)
  description: >-
    Derived products computed from historical CO-OPS water-level records — sea level trends, annual mean
    sea level reports, top-10 water levels, and extreme event summaries — exposed as a machine-readable
    companion to the data and metadata APIs.
  humanURL: https://api.tidesandcurrents.noaa.gov/dpapi/prod/
