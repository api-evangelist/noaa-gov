apis:
- aid: noaa-gov:swpc-data-service
  name: Space Weather Prediction Center (SWPC) Data Service
  description: >-
    SWPC publishes solar wind, geomagnetic, X-ray flux, aurora forecast, radiation storm, and coronal
    mass ejection products through a static-file data service organised by format. JSON, text, and image
    feeds refresh on intervals from one minute (real-time solar wind) to daily summaries. No authentication
    required; products power aviation, satellite, power grid, GPS, and HAM radio operators. A modernization
    of the JSON catalog landed 2026-03-31 with old products deprecated 2026-04-30.
  humanURL: https://www.swpc.noaa.gov/content/data-access
  baseURL: https://services.swpc.noaa.gov
  tags:
  - Space Weather
  - Solar
  - Geomagnetic
  - Aurora
  - Real-Time
  properties:
